[workspace]
resolver = "3"
members = ["crates/ableton-core", "crates/tauri-plugin-ableton"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/leolabs/ableton-js"

[workspace.dependencies]
ableton-core = { path = "crates/ableton-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1.53"
tracing = "0.1"
